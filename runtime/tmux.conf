# cybermole tmux.conf — applied to the app's tmux server at start (-f is read
# only when the server boots, i.e. on the first new-session; every tmux
# invocation from src/lib/tmux.ts carries it). Picked for browser-terminal
# (xterm.js) use; override location with CYBERMOLE_TMUX_CONF.

# Deliver ESC immediately — xterm.js has no legacy escape ambiguity, and the
# 500ms default makes Escape/Alt feel broken in TUIs (pi's own docs suggest
# ~10ms for local terminals).
set -g escape-time 10

# CSI-u key encoding between tmux and the programs in panes (pi warns on
# startup otherwise: modified Enter keys may not work). Server options — a
# long-lived tmux server predating this conf keeps its old values, so apply
# them live once: `tmux -L <socket> set -s extended-keys on` and
# `tmux -L <socket> set -s extended-keys-format csi-u`.
set -s extended-keys on
set -s extended-keys-format csi-u

# Deep scrollback: resumed sessions are searchable, and the (planned)
# capture-pane backfill on attach wants history to exist. 100k lines ≈ tens
# of MB per session ceiling, only allocated as used.
set -g history-limit 100000

# Let applications see focus enter/leave (pi's TUI uses it to pause
# spinner/progress redraws while you're in another tab).
set -g focus-events on

# True colour: the attach pty forces TERM=xterm-256color + COLORTERM, and
# tmux translates RGB for whatever TERM panes use. Without this, 24-bit
# colours quantise to the 256 palette.
set -as terminal-features ',xterm-256color:RGB'

# No alternate-screen switch for the ATTACHING client (xterm.js): tmux's
# attach normally opens with smcup (ESC[?1049h), which drops the browser
# terminal into the alternate buffer — no scrollback, nothing to scroll
# or search. Removing smcup/rmcup for the client's TERM keeps xterm in
# the normal buffer, so live output accumulates scrollback and the
# capture-pane backfill written on reattach (server/main.ts) survives
# under the redraw. Pane-side apps (vim, less) still get tmux's own
# alt-screen tracking — they just redraw the pane instead of switching
# the outer buffer.
set -as terminal-overrides ',xterm-256color:smcup@:rmcup@'

# No scroll-by-N for the attaching client either: tmux batches a pane's
# scrolled lines as CSI SU (ESC[<n>S), and xterm.js's SU DISCARDS the
# scrolled-off rows (it splices them out instead of pushing them into
# scrollback) — attached terminals never grew scrollback past one screen
# while live. Without indn tmux falls back to scroll-region + plain LFs,
# which xterm.js scrolls through the buffer (scrollback accumulates, so
# ctrl+F and the attach backfill have something to work on). Bursts faster
# than tmux's redraw tick still coalesce in the client's view (tmux's
# screen-diff skips lines for ANY outer terminal, real xterm included) —
# the capture-pane backfill on the next attach heals exactly that.
set -as terminal-overrides ',xterm-256color:indn@'

# Mouse stays OFF, deliberately: xterm.js keeps native browser text
# selection + copy, and pi handles wheel scrolling itself in fullscreen
# mode. Flip this on together with pi `tuiMode: "regular"` if you'd rather
# have tmux-side wheel scrolling of scrollback (see TODO.md). (Operator
# machines' own ~/.tmux.conf sets it ON — that file and this one share
# the QoL block and the plugin set; keep them in sync.)
set -g mouse off

# --- plugins (TPM; same set as operator machines' ~/.tmux.conf) ---
# tmux-resurrect + tmux-continuum: session save/restore for this server
# — a reboot (or last-session server exit) no longer loses the layout.
# Continuum saves every 15 min and restores on the first server start
# with no sessions; panes return as fresh shells in their saved working
# directories (programs are not re-run by default; pi transcripts live
# in the store either way, so nothing durable ever depended on this).
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# TPM loads only when installed for the user the tmux server runs as
# (git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm —
# the violet deploy script does this for the app user). Without it the
# block above is inert.
if-shell 'test -d ~/.tmux/plugins/tpm' 'run "~/.tmux/plugins/tpm/tpm"'
