# web-pi — one image; in prod, two containers (privilege split,
# DESIGN_REVIEW §1.1) + a one-shot init; in dev, a single-user container.
#
#   prod:  docker compose up -d   → loopback :3000, reverse-proxy TLS in front
#
#     webpi      uid node   — serves HTTP/WS from the image's root-owned
#                            /opt/web-pi (immutable to the app user); owns
#                            web state (webpi.db) on /state; only a tmux
#                            CLIENT on the shared socket.
#     workspace  uid 2000   — owns the tmux server and every pi session;
#                            checkouts + pi-agent live on the
#                            webpi-workspace volume; the web user is
#                            admitted as a tmux client via server-access.
#     workspace-init (one-shot) — chowns/chmods the shared volumes: socket
#                            dir 2770 setgid webpi, /workspace owned by
#                            uid 2000 (same pattern as dev-init below).
#     builder   (task/mgmt-page) — release builds for /management: dev-
#                            target image, uid 2010, offline; watches
#                            marker files on the webpi-releases volume
#                            (deploy/builder-entrypoint.sh, docs/
#                            management-page.md §2).
#     releases-init (one-shot) — the releases volume's group layout
#                            (web+builder shared dirs, web-only pointer).
#     seaweedfs  object storage (S3 API, src/lib/storage.ts) — on the
#                            internal `storage` network with webpi ONLY:
#                            workspace (pi sessions) can't reach it.
#     seaweedfs-init (one-shot) — generates the S3 credentials both sides
#                            load, once, onto their own volume.
#
#   observability (opt-in):  docker compose --profile observability up -d
#          → loki + grafana + a one-shot loki-init. Loki (log aggregation,
#          winston-loki push API) publishes NO port — webpi reaches it as
#          http://loki:3100 over the compose network (set WEB_PI_LOKI_URL
#          when bringing the profile up). Grafana is loopback-published on
#          :3300 with the datasource provisioned. Plain `up` and the dev
#          profile start none of it — the server logs console-only when
#          loki is absent, by design.
#   editor profile (opt-in):  docker compose --profile editor up -d
#
#     editor     uid 2000 — the VSCodium reh-web editor (docs/
#                            editor-webapp.md): self-hosted VS Code in the
#                            browser with server-side files, served through
#                            web-pi's same-origin /editor proxy behind the
#                            session gate. Edits the same webpi-workspace
#                            volume at the same /workspace path as the
#                            workspace container.
#     editor-init (one-shot) — chowns the editor home volume (VSCodium
#                            user-data/extensions; empty named volumes start
#                            root-owned and uid 2000 must write $HOME).
#
#   Bring the profile up WITH the proxy on: set
#   WEB_PI_EDITOR_UPSTREAM=http://editor:3000 next to compose.yaml (a .env
#   file) so `up -d` recreates webpi too — `up -d editor` alone boots the
#   editor next to a running webpi whose env still has it off.
#
#   dev:   docker compose --profile dev up dev     → single-user dev servers
#          with the repo bind-mounted (the split is a prod shape; dev
#          stays one container).
#
# Name the `dev` service (as above): services without profiles (webpi,
# workspace, workspace-init) start on every `up`, so a bare
# `--profile dev up` would boot prod alongside.
#
# pi is an npm dependency pinned by the lockfile, vendored in the image at
# /opt/web-pi/node_modules — the workspace container runs it from there
# (same image ⇒ same path); updating pi in the split is an image rebuild
# or a workspace-side checkout (README "Updating").
#
# Dev runs as ${UID:-1000}:${GID:-1000} so the container user matches the
# host checkout's owner (bash doesn't export UID/GID — `export UID GID`
# first, or put them in a .env next to this file).

name: web-pi

# SeaweedFS `weed mini`: master + volume + filer + S3 in one process. Only
# the S3 API is wanted — the rest of what mini starts by default (admin
# UI, WebDAV, Iceberg/Lance catalogs) is off, and so is its phone-home
# telemetry (default on). The bucket is created by the app on first use.
# Pinned: mini's defaults "may evolve over releases".
x-seaweedfs: &seaweedfs
  image: chrislusf/seaweedfs:4.48
  init: true
  security_opt: ["no-new-privileges:true"]
  command:
    - mini
    - -dir=/data
    - -master.telemetry=false
    - -admin.ui=false
    - -webdav=false
    - -s3.port.iceberg=0
    - -s3.port.lance=0

x-webpi-build: &webpi-build
  context: .
  target: prod # slim: no compiler toolchain (dev target has it)
  args:
    # Baked into the pages at build time AND needed at runtime — keep in sync.
    WEB_PI_BASE: ${WEB_PI_BASE:-/}
    # task/mgmt-page (docs/management-page.md §1.2): the source commit the
    # image is built from — the trusted root of the management page's
    # enforcement base. Build with: GIT_SHA=$(git rev-parse HEAD) docker
    # compose build . Without it version.json records "unknown" and the
    # management page refuses applies (base_unknown) until it does.
    GIT_SHA: ${GIT_SHA:-unknown}

services:
  webpi:
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
      # Started, not healthy: storage connects lazily (first upload), and
      # an upload while it is still booting is a retryable 502.
      seaweedfs:
        condition: service_started
      # task/mgmt-page: the releases volume's layout must exist before web
      # reads/writes markers or the pointer on it.
      releases-init:
        condition: service_completed_successfully
    build: *webpi-build
    # web-pi:local is built on this box (below). To run a CI-built image
    # instead (release tags publish ghcr.io/<owner>/web-pi), set WEB_PI_IMAGE
    # and `docker compose pull webpi` before `up -d` — README "Deploying".
    # The pulled image's build-time WEB_PI_BASE still applies.
    image: ${WEB_PI_IMAGE:-web-pi:local}
    # tini as PID 1: reaps reparented processes, and relays signals to node
    # as PID 1's direct child (the SIGTERM handler drains websockets +
    # stops the scheduler and exits 0 within ~5s; without an init, PID-1
    # node would drop an unhandled SIGTERM and burn the full grace before
    # SIGKILL).
    init: true
    # Block setuid/file-cap elevation inside the container — sessions must
    # never climb to root-in-container (the first step of most escapes).
    # node/npm/tmux/node-pty need none of it.
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:3000:3000" # loopback publish; TLS reverse proxy in front (deploy/)
    working_dir: /opt/web-pi # serve the image copy — no /app volume anymore
    environment:
      WEB_PI_BASE: ${WEB_PI_BASE:-/}
      # One proxy hop (deploy/nginx-webpi.conf): rate limits key on the IP
      # nginx appended to X-Forwarded-For. Safe with the loopback-only
      # publish below — only local processes can reach the port directly.
      WEB_PI_TRUST_PROXY: 1
      # Web state only (login db, hidden sessions, jobs) on its own volume.
      WEB_PI_STATE_DIR: /state
      # --- privilege-split wiring. These paths resolve in the WORKSPACE
      # container (its tmux server spawns every session), so both
      # containers mount the shared volumes at the same mount points.
      # Absolute socket path ⇒ tmux -S + the never-fork guard
      # (src/lib/tmux.ts); the workspace entrypoint owns the server.
      WEB_PI_TMUX_SOCKET: /run/web-pi/tmux
      # HOME handed to spawned pi — /home/workspace is uid 2000's home
      # over there (writable; the node image's /home/node is not).
      WEB_PI_HOME: /home/workspace
      # pi's runtime dir (credentials + sessions) rides with the workspace
      # uid; WEB_PI_SESSIONS_DIR derives to /workspace/pi-agent/sessions —
      # what the sidebar scans (web reads it via the shared group).
      WEB_PI_AGENT_DIR: /workspace/pi-agent
      WEB_PI_NEW_SESSION_CWD: /workspace
      # Object storage. The keys aren't here: seaweedfs-init generates them
      # into /run/web-pi-s3/credentials.env and docker-entrypoint.sh loads
      # them (WEB_PI_S3_ACCESS_KEY / WEB_PI_S3_SECRET_KEY).
      WEB_PI_S3_ENDPOINT: http://seaweedfs:8333
      # task/winston-loki: winston-loki push URL — set on the host (or .env)
      # when you bring the observability profile up: 
      #   WEB_PI_LOKI_URL=http://loki:3100 docker compose --profile observability up -d
      # (up -d then recreates webpi to pick it up). Unset/empty = console-only
      # logging; the dev profile and plain hosts stay that way.
      WEB_PI_LOKI_URL: ${WEB_PI_LOKI_URL:-}
      # task/ws-editor (docs/editor-webapp.md): the editor webapp's
      # upstream on the compose network — THE single switch. Unset/empty =
      # editor off (/editor answers 404, console hides its affordances);
      # set with the editor profile deployed = the same-origin proxy. No
      # token or launch URL: auth is the web session, folders are URL params.
      WEB_PI_EDITOR_UPSTREAM: ${WEB_PI_EDITOR_UPSTREAM:-}
      # task/mgmt-page (docs/management-page.md): the release-swap half of
      # /management. The releases volume is shared with the `builder`
      # service below; the checkout is web's read-only view of the
      # sessions' tree (a checkout pi edits — README "Updating").
      WEB_PI_RELEASES_DIR: /releases
      WEB_PI_MANAGEMENT_CHECKOUT: /workspace/web-pi
    networks: [default, storage]
    volumes:
      - webpi-state:/state
      - webpi-s3-credentials:/run/web-pi-s3:ro
      # Read access to pi's session store (sidebar/resume); web never
      # writes here — hidden flags live in its own db on /state. :ro makes
      # that a container-level fact, not just a convention (the session
      # cwd /workspace only needs to exist, which :ro preserves).
      - webpi-workspace:/workspace:ro
      - webpi-tmux:/run/web-pi
      # task/mgmt-page: releases web built + swapped (rw — web writes the
      # pending markers and the web-only pointer volume; the builder writes
      # the releases themselves via the shared `releases` group).
      - webpi-releases:/releases
      # The web-only pointer volume, mounted INSIDE the shared one: the
      # builder shares the protocol volume's root (it must move releases
      # into it) — a pointer DIR under that root would be renameable by
      # the builder, so the pointer gets its own volume instead, which
      # this container alone mounts (releases-init chowns it node:node).
      - webpi-releases-pointer:/releases/pointer
    restart: unless-stopped

  # The working half of the split: same image, uid 2000, owns the tmux
  # server (exit-empty off) and every pi session. Admits the web user
  # (node) as a tmux client via server-access on the shared socket.
  workspace:
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    build: *webpi-build # same build as webpi (BuildKit dedupes); declared so a cold machine never tries to PULL web-pi:local (cf. dev-init)
    image: ${WEB_PI_IMAGE:-web-pi:local}
    user: "workspace"
    init: true
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/docker-workspace-entrypoint.sh"]
    healthcheck:
      disable: true # the image's healthcheck probes the web server; this container only runs tmux
    environment:
      WEB_PI_TMUX_SOCKET: /run/web-pi/tmux
      WEB_PI_AGENT_DIR: /workspace/pi-agent
      WEB_PI_TMUX_WEB_USER: node # admitted as a tmux client by NAME
      WEB_PI_TMUX_GROUP: webpi # socket group after chgrp (gid 2001 in-image)
    volumes:
      - webpi-tmux:/run/web-pi # the shared socket (0660 webpi after the entrypoint's chmod/chgrp)
      - webpi-workspace:/workspace # checkouts + pi-agent (umask 0007 keeps files group-shared)
    restart: unless-stopped

  # One-shot: empty named volumes are created root-owned; the split needs
  # the socket dir 2770 setgid webpi (socket creation + group inheritance)
  # and /workspace owned by uid 2000. Runs on every `up` — a no-op chown
  # once ownership is right. (Entrypoint overridden: the web entrypoint
  # must not run here.)
  workspace-init:
    build: *webpi-build
    image: ${WEB_PI_IMAGE:-web-pi:local}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown workspace:webpi /run/web-pi /workspace && chmod 2770 /run/web-pi /workspace"]
    restart: "no"
    volumes:
      - webpi-tmux:/run/web-pi
      - webpi-workspace:/workspace

  # task/mgmt-page — the releases volumes' layout (docs/management-page.md
  # §2). TWO volumes: the shared protocol volume (marker dirs + release
  # dirs — group `releases` (web + builder), NEVER the sessions' uid; the
  # group is the boundary) and the web-ONLY pointer volume mounted at
  # /releases/pointer INSIDE it (what the next boot serves — serving/
  # display state only; NEVER the enforcement's diff base, which is
  # always the image's root-owned version.json sha — applied code runs
  # in-process as the web uid and could write the pointer, docs/
  # management-page.md §1.2/§1.5 #6). The pointer cannot live on the
  # shared volume: its root is group-writable (the builder moves release
  # dirs into it), and anything
  # under a group-writable dir can be renamed away by the group — a
  # separate volume mount is unreachable in the builder's mount namespace
  # (the same nested-mount pattern the dev profile uses for
  # /app/node_modules). Runs on every `up`.
  releases-init:
    build: *webpi-build
    image: ${WEB_PI_IMAGE:-web-pi:local}
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /releases/pending /releases/building /releases/done && chown node:releases /releases && chmod 2770 /releases && chown node:releases /releases/pending /releases/building /releases/done && chmod 2770 /releases/pending /releases/building /releases/done && chown node:node /releases/pointer && chmod 0750 /releases/pointer"]
    restart: "no"
    volumes:
      - webpi-releases:/releases
      - webpi-releases-pointer:/releases/pointer

  # task/mgmt-page — the management page's build half: watches the pending
  # markers on the releases volume and builds content-addressed releases
  # (deploy/builder-entrypoint.sh has the contract). Runs as user
  # `builder` (uid 2010: webpi group to READ the checkout, `releases`
  # group to write the volume — deliberately NOT uid 2000, which pi
  # sessions share). Dev image target (toolchain); NO network at all —
  # the build reuses the image's node_modules (protected lockfile ⇒ same
  # deps) and fetches nothing. Never a docker socket; web only ever
  # triggers it by writing a marker file.
  builder:
    depends_on:
      releases-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
    build:
      context: .
      target: dev # toolchain — this is the image's dev target's day job
      args:
        WEB_PI_BASE: ${WEB_PI_BASE:-/}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: web-pi:local-dev
    user: "builder"
    init: true
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/builder-entrypoint.sh"]
    healthcheck:
      disable: true # the image's healthcheck probes the web server; this container only builds
    environment:
      WEB_PI_RELEASES_DIR: /releases
      WEB_PI_MANAGEMENT_CHECKOUT: /workspace/web-pi
    network_mode: none # offline by design — nothing is fetched at build time
    volumes:
      - webpi-workspace:/workspace:ro # the checkout, read-only (never writes the sessions' tree)
      - webpi-releases:/releases # markers + release dirs (never the pointer volume — that
                                 # mount exists only in webpi, which is the pointer's boundary)
    restart: unless-stopped

  # Object storage for the web side: only webpi shares its network (no
  # published port). Its gRPC/filer/master ports are unauthenticated —
  # the network is the boundary, and `internal` also leaves it no route
  # out. Takes the generated keys as its admin identity
  # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are mini's env names for
  # it); anonymous S3 requests get 403.
  seaweedfs:
    <<: *seaweedfs
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    entrypoint:
      - sh
      - -c
      - >-
        set -a && . /run/web-pi-s3/credentials.env && set +a &&
        export AWS_ACCESS_KEY_ID="$$WEB_PI_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$WEB_PI_S3_SECRET_KEY" &&
        exec /entrypoint.sh "$$@"
      - sh
    networks: [storage]
    volumes:
      - webpi-seaweedfs:/data
      - webpi-s3-credentials:/run/web-pi-s3:ro
    restart: unless-stopped

  # One-shot: generates the S3 credentials on first `up` (kept thereafter —
  # the store's data is only readable with them). One file, two readers:
  # docker-entrypoint.sh (webpi, uid node — hence the owner) and the
  # seaweedfs wrapper above (root before it drops to its own user).
  seaweedfs-init:
    build: *webpi-build
    image: ${WEB_PI_IMAGE:-web-pi:local}
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - >-
        f=/run/web-pi-s3/credentials.env;
        if [ ! -s "$$f" ]; then
        umask 077 &&
        printf 'WEB_PI_S3_ACCESS_KEY=webpi\nWEB_PI_S3_SECRET_KEY=%s\n'
        "$$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")" > "$$f.tmp" &&
        mv "$$f.tmp" "$$f";
        fi &&
        chown node:node "$$f" && chmod 0400 "$$f"
    restart: "no"
    volumes:
      - webpi-s3-credentials:/run/web-pi-s3

  # task/winston-loki: log aggregation, opt-in via the `observability`
  # profile. Single-binary Loki, filesystem storage on the webpi-loki
  # volume (deploy/loki/config.yaml: retention 14d, hard caps on
  # entry/label sizes, no telemetry). No published port — webpi pushes
  # over the compose network; a down/restarted loki degrades silently on
  # the server side (batch drops + 60s retry backoff, src/lib/logger.ts).
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.8
    depends_on:
      loki-init:
        condition: service_completed_successfully
    command: ["-config.file=/etc/loki/config.yaml"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/loki/config.yaml:/etc/loki/config.yaml:ro
      - webpi-loki:/loki
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }
    restart: unless-stopped

  # One-shot (same pattern as workspace-init/dev-init): empty named
  # volumes start root-owned and the loki image runs as uid 10001 — it
  # needs /loki writable before it boots. Runs on every `up` of the
  # profile; a no-op chown once ownership is right.
  loki-init:
    profiles: ["observability"]
    build: *webpi-build # same build as webpi (BuildKit dedupes; never PULLs web-pi:local)
    image: ${WEB_PI_IMAGE:-web-pi:local}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /loki"]
    restart: "no"
    volumes:
      - webpi-loki:/loki

  # task/winston-loki: log UI, opt-in via the `observability` profile.
  # Loopback-published on :3300 (3000/3001/4321 are web-pi's). Auth:
  # anonymous read-only browsing (it's loopback-only; no default-password
  # exposure), the admin account for edits — first login forces the
  # default-password change. No data volume: grafana state is disposable;
  # the datasource (and any dashboards worth keeping) is provisioned from
  # deploy/grafana/provisioning, checked in.
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.3
    depends_on:
      - loki
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits: { memory: 512m, cpus: "0.5" }
    restart: unless-stopped
  # task/ws-editor: the VSCodium reh-web editor — opt-in profile (docs/
  # editor-webapp.md). The image (editor/) vendors the PINNED reh-web
  # tarball and runs its server component as the workspace uid (2000) so
  # it edits the shared checkouts; it never touches the tmux socket or web
  # state, and it publishes NOTHING — web-pi's same-origin /editor proxy is
  # the only door. Bring up with WEB_PI_EDITOR_UPSTREAM=http://editor:3000
  # so webpi is recreated with the proxy on (see the header comment).
  editor:
    profiles: ["editor"]
    depends_on:
      editor-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
    build:
      context: ./editor
      args: # same pins as editor/Dockerfile's defaults; here so they drift visibly
        VSCODIUM_VERSION: ${VSCODIUM_VERSION:-1.140.06880}
    image: web-pi-editor:local
    user: "workspace"
    init: true # signal reaping: the server spawns ptyHost/fileWatcher children
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/docker-editor-entrypoint.sh"]
    environment:
      # Interpolates into --server-base-path: the proxy mounts the app at
      # ${WEB_PI_BASE%/}/editor, and the editor's asset URLs must line up.
      WEB_PI_BASE: ${WEB_PI_BASE:-/}
    volumes:
      - webpi-workspace:/workspace # the checkouts — rw, as the workspace uid
      - webpi-editor-home:/home/workspace # VSCodium user-data/extensions (persistent)
    restart: unless-stopped

  # task/ws-editor: one-shot — empty named volumes start root-owned and
  # uid 2000 must write $HOME (.vscodium-server data/extensions, .local
  # state). Runs on every `up` of the profile; a no-op chown once right.
  editor-init:
    profiles: ["editor"]
    build:
      context: ./editor
      # Same pins as the editor service above: both build the same tag, so
      # an operator override must reach both builds — a default-pins
      # editor-init image would otherwise sit under the overridden tag (or
      # silently revert it on the next editor-init-only build).
      args:
        VSCODIUM_VERSION: ${VSCODIUM_VERSION:-1.140.06880}
    image: web-pi-editor:local
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R workspace:webpi /home/workspace"]
    restart: "no"
    volumes:
      - webpi-editor-home:/home/workspace

  # One-shot: empty named volumes are created root-owned; the dev service
  # runs as ${UID:-1000} and must write node_modules. Runs on every `up` — a
  # no-op chown once ownership is right. (Entrypoint overridden: without the
  # repo bind there's no /app/package.json, and the seed logic must not run.)
  dev-init:
    profiles: ["dev"]
    # Own build (identical to dev's — BuildKit dedupes) so this service
    # never tries to *pull* web-pi:local-dev on a cold machine or under
    # partial invocations (compose --profile dev run dev-init).
    build:
      context: .
      target: dev
      args:
        WEB_PI_BASE: ${WEB_PI_BASE:-/}
    image: web-pi:local-dev
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R ${UID:-1000}:${GID:-1000} /app/node_modules"]
    restart: "no"
    volumes:
      - webpi-dev-node-modules:/app/node_modules

  # Dev object storage: throwaway, fixed keys (the dev service and the
  # host flow use the same pair), loopback-published so `npm run
  # dev:server` on the host can reach it too — `docker compose --profile
  # dev up -d dev-seaweedfs`, then the WEB_PI_S3_* values below with
  # http://127.0.0.1:8333 (README "Developing").
  dev-seaweedfs:
    <<: *seaweedfs
    profiles: ["dev"]
    environment:
      AWS_ACCESS_KEY_ID: webpi-dev
      AWS_SECRET_ACCESS_KEY: webpi-dev-secret
    ports:
      - "127.0.0.1:8333:8333" # S3 API only

  dev:
    profiles: ["dev"]
    depends_on:
      dev-init:
        condition: service_completed_successfully
      dev-seaweedfs:
        condition: service_started
    build:
      context: .
      target: dev # runtime + build-essential/python3: the container npm-installs node-pty
      args:
        WEB_PI_BASE: ${WEB_PI_BASE:-/}
    image: web-pi:local-dev
    # Match the container user to the host checkout's owner so bind-mounted
    # files (and .astro/, dist-server/ writes) aren't permission-fought.
    user: "${UID:-1000}:${GID:-1000}"
    # Same two guards as webpi: prompt stop/restart, no in-container
    # privilege elevation.
    init: true
    security_opt: ["no-new-privileges:true"]
    # Neutralise the image's entrypoint: /app is a bind mount of the host
    # checkout, and the entrypoint serves the image copy — dev wants the
    # bind. WORKDIR /app already covers the cd.
    entrypoint: []
    # The repo is bind-mounted; node_modules is a *shadow* volume so the
    # container builds its own native deps (node-pty) without touching the
    # host's. npm install runs every boot — seconds when current, and it
    # self-heals (e.g. after a NODE_ENV change) unlike a marker-file check.
    command:
      ["sh", "-c", "npm install --no-audit --no-fund; npm run dev:server & exec npm run dev -- --host --force"]
    ports:
      - "127.0.0.1:4321:4321" # astro dev (proxies /api,/ws,login to :3001 in-container)
      - "127.0.0.1:3001:3001" # the API+WS half (npm run dev:server)
    environment:
      NODE_ENV: development # the image says production — npm would omit devDeps (tsc, @types/*)
      ASTRO_TELEMETRY_DISABLED: "1"
      WEB_PI_BASE: ${WEB_PI_BASE:-/} # same value the pages were built with
      WEB_PI_NEW_SESSION_CWD: /app
      # HOME is unwritable for non-1000 uids (see npm_config_cache below) and
      # /app is the host bind — so the $WEB_PI_HOME/.local/state default
      # won't do here. Dev state (login db, dev pi-agent) is throwaway: it
      # lives in the container's /tmp and re-set-password after a recreate.
      WEB_PI_STATE_DIR: /tmp/web-pi-state
      # A non-1000 uid has no passwd entry → HOME=/ → npm's cache is unwritable there
      npm_config_cache: /tmp/.npm
      WEB_PI_S3_ENDPOINT: http://dev-seaweedfs:8333
      WEB_PI_S3_ACCESS_KEY: webpi-dev
      WEB_PI_S3_SECRET_KEY: webpi-dev-secret
      # task/mgmt-page: dev's "workspace checkout" is the bind-mounted
      # repo itself (version.json won't exist — /management then runs in
      # its read-only/dry-run mode unless you write one by hand; the
      # releases half needs the volume wiring from the prod services).
      WEB_PI_MANAGEMENT_CHECKOUT: /app
    healthcheck:
      disable: true # the prod image probes :3000; dev serves :4321/:3001
    volumes:
      # :z relabels the tree container_file_t on SELinux-enforcing hosts
      # (no-op elsewhere) — without it container processes can't even stat
      # files in a home-dir checkout.
      - .:/app:z
      - webpi-dev-node-modules:/app/node_modules # shadow: container-built native deps
    # no restart policy: dev is an interactive foreground thing

volumes:
  # Explicit names (no project prefix) so the volumes stay stable across
  # checkouts with different directory names.
  webpi-state:
    name: webpi-state
  # Split volumes: the shared tmux socket dir, and the workspace uid's
  # tree (checkouts + pi-agent). The pre-split webpi-app volume is
  # obsolete (web serves from the image now) and is left in place,
  # unused, on existing hosts.
  webpi-tmux:
    name: webpi-tmux
  webpi-workspace:
    name: webpi-workspace
  # task/mgmt-page: built releases + the marker protocol (docs/
  # management-page.md §2–3). Group `releases` (web + builder) is the
  # boundary — the sessions' uid is not in it.
  webpi-releases:
    name: webpi-releases
  # task/mgmt-page: the web-only pointer (what the next boot serves —
  # serving/display state, never a diff base; see the comment above), its
  # own volume so the builder (group-writer of the protocol volume's
  # root) can never rename/replace it. Mounted
  # only by webpi + releases-init, at /releases/pointer inside the
  # shared volume's mount.
  webpi-releases-pointer:
    name: webpi-releases-pointer
  webpi-dev-node-modules:
    name: webpi-dev-node-modules
  # Object storage data, and the generated credentials that unlock it —
  # back them up together.
  webpi-seaweedfs:
    name: webpi-seaweedfs
  webpi-s3-credentials:
    name: webpi-s3-credentials
  # task/winston-loki: Loki's filesystem storage (chunks, index, WAL,
  # compactor working dir) — owned by the loki image's uid 10001
  # (loki-init chowns it on first up).
  webpi-loki:
    name: webpi-loki
  # task/ws-editor: the editor's home (uid 2000) — VSCodium user-data,
  # extensions, server state (editor-init chowns it on first up).
  webpi-editor-home:
    name: webpi-editor-home

networks:
  # webpi ↔ seaweedfs only. internal: no route out (and none in from
  # outside the two containers' own stack).
  storage:
    name: webpi-storage
    internal: true
