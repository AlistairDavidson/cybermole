# cybermole — one image; in prod, two containers (privilege split,
# DESIGN_REVIEW §1.1) + a one-shot init; in dev, a single-user container.
#
#   prod:  docker compose up -d   → loopback :3000, reverse-proxy TLS in front
#
#     cybermole      uid node   — serves HTTP/WS from the image's root-owned
#                            /opt/cybermole (immutable to the app user); owns
#                            web state (cybermole.db) on /state; only a tmux
#                            CLIENT on the shared socket.
#     workspace  uid 2000   — owns the tmux server and every pi session;
#                            checkouts + pi-agent live on the
#                            cybermole-workspace volume; the web user is
#                            admitted as a tmux client via server-access.
#     workspace-init (one-shot) — chowns/chmods the shared volumes: socket
#                            dir 2770 setgid cybermole, /workspace owned by
#                            uid 2000 (same pattern as dev-init below),
#                            and the job-run log dir laid out the same
#                            way (plan §9; see the workspace-init service).
#     seaweedfs  object storage (S3 API, src/lib/platform/storage.ts) — on the
#                            internal `storage` network with cybermole ONLY:
#                            workspace (pi sessions) can't reach it.
#     seaweedfs-init (one-shot) — generates the S3 credentials both sides
#                            load, once, onto their own volume.
#     editor     uid 2000 — the VSCodium reh-web editor (docs/
#                            editor-webapp.md): self-hosted VS Code in the
#                            browser with server-side files, served through
#                            cybermole's same-origin /editor proxy behind the
#                            session gate. Edits the same cybermole-workspace
#                            volume at the same /workspace path as the
#                            workspace container.
#     editor-init (one-shot) — chowns the editor home volume (VSCodium
#                            user-data/extensions; empty named volumes start
#                            root-owned and uid 2000 must write $HOME).
#
#   The editor ships in the plain stack (`npm start` / docker compose up -d):
#   cybermole's CYBERMOLE_EDITOR_UPSTREAM defaults to http://editor:3000 below. Opt
#   out by setting it EMPTY in a .env next to compose.yaml — the console
#   hides the editor tab and /editor answers 404 (the idle container is
#   cheap to leave running).
#
#   observability (opt-in):  docker compose --profile observability up -d
#          → loki + grafana + a one-shot loki-init. Loki (log aggregation,
#          winston-loki push API) publishes NO port — cybermole reaches it as
#          http://loki:3100 over the compose network (set CYBERMOLE_LOKI_URL
#          when bringing the profile up). Grafana is loopback-published on
#          :3300 with the datasource provisioned. Plain `up` and the dev
#          profile start none of it — the server logs console-only when
#          loki is absent, by design.
#
#   dev:   npm run dev   (= docker compose --profile dev up --build dev)
#          → the single-user dev server on loopback :3001 (the repo
#          bind-mounted; the split is a prod shape, dev stays one app
#          container) + dev-editor (the same editor image as the HOST uid
#          over the same bind, so the editor tab opens the checkout dev
#          workspaces live in) + dev-seaweedfs, each with a one-shot init.
#
# Name the `dev` service: services without profiles (the prod stack above)
# start on every `up`, so a bare `--profile dev up` would boot prod
# alongside.
#
# pi is an npm dependency pinned by the lockfile, vendored in the image at
# /opt/cybermole/node_modules — the workspace container runs it from there
# (same image ⇒ same path); updating pi in the split is an image rebuild
# or a workspace-side checkout (README "Updating").
#
# Dev runs as ${UID:-1000}:${GID:-1000} so the container user matches the
# host checkout's owner (bash doesn't export UID/GID — `export UID GID`
# first, or put them in a .env next to this file).

name: cybermole

# SeaweedFS `weed mini`: master + volume + filer + S3 in one process. Only
# the S3 API is wanted — the rest of what mini starts by default (admin
# UI, WebDAV, Iceberg/Lance catalogs) is off, and so is its phone-home
# telemetry (default on). The bucket is created by the app on first use.
# Pinned: mini's defaults "may evolve over releases".
x-seaweedfs: &seaweedfs
  image: chrislusf/seaweedfs:4.48
  init: true
  security_opt: ["no-new-privileges:true"]
  command:
    - mini
    - -dir=/data
    - -master.telemetry=false
    - -admin.ui=false
    - -webdav=false
    - -s3.port.iceberg=0
    - -s3.port.lance=0

x-cybermole-build: &cybermole-build
  context: .
  target: prod # slim: no compiler toolchain (dev target has it)
  args:
    # Baked into the pages at build time AND needed at runtime — keep in sync.
    CYBERMOLE_BASE: ${CYBERMOLE_BASE:-/}

services:
  cybermole:
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
      # Started, not healthy: storage connects lazily (first upload), and
      # an upload while it is still booting is a retryable 502.
      seaweedfs:
        condition: service_started
    build: *cybermole-build
    # cybermole:local is built on this box (below). To run a CI-built image
    # instead (release tags publish ghcr.io/<owner>/cybermole), set CYBERMOLE_IMAGE
    # and `docker compose pull cybermole` before `up -d` — README "Deploying".
    # The pulled image's build-time CYBERMOLE_BASE still applies.
    image: ${CYBERMOLE_IMAGE:-cybermole:local}
    # tini as PID 1: reaps reparented processes, and relays signals to node
    # as PID 1's direct child (the SIGTERM handler drains websockets +
    # stops the scheduler and exits 0 within ~5s; without an init, PID-1
    # node would drop an unhandled SIGTERM and burn the full grace before
    # SIGKILL).
    init: true
    # Block setuid/file-cap elevation inside the container — sessions must
    # never climb to root-in-container (the first step of most escapes).
    # node/npm/tmux/node-pty need none of it.
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:3000:3000" # loopback publish; TLS reverse proxy in front (deploy/)
    working_dir: /opt/cybermole # serve the image copy — no /app volume anymore
    environment:
      CYBERMOLE_BASE: ${CYBERMOLE_BASE:-/}
      # One proxy hop (deploy/nginx/cybermole.conf): rate limits key on the IP
      # nginx appended to X-Forwarded-For. Safe with the loopback-only
      # publish below — only local processes can reach the port directly.
      CYBERMOLE_TRUST_PROXY: 1
      # Web state only (login db, hidden sessions, jobs) on its own volume.
      CYBERMOLE_STATE_DIR: /state
      # --- privilege-split wiring. These paths resolve in the WORKSPACE
      # container (its tmux server spawns every session), so both
      # containers mount the shared volumes at the same mount points.
      # Absolute socket path ⇒ tmux -S + the never-fork guard
      # (src/lib/terminals/tmux.ts); the workspace entrypoint owns the server.
      CYBERMOLE_TMUX_SOCKET: /run/cybermole/tmux
      # HOME handed to spawned pi — /home/workspace is uid 2000's home
      # over there (writable; the node image's /home/node is not).
      CYBERMOLE_HOME: /home/workspace
      # pi's runtime dir (credentials + sessions) rides with the workspace
      # uid; CYBERMOLE_SESSIONS_DIR derives to /workspace/pi-agent/sessions —
      # what the sidebar scans (web reads it via the shared group).
      CYBERMOLE_AGENT_DIR: /workspace/pi-agent
      CYBERMOLE_NEW_SESSION_CWD: /workspace
      # task/defaults-settings: the shipped default shell — zsh -l (the
      # image installs zsh; it must exist in the WORKSPACE container too,
      # whose tmux spawns every terminal — same image, so it does).
      # Override-able as always: plain hosts keep the host-safe dynamic
      # default ($SHELL -l), and /settings can pin a per-install value in
      # the state db on top of this.
      CYBERMOLE_COMMAND: "${CYBERMOLE_COMMAND:-zsh -l}"
      # Object storage. The keys aren't here: seaweedfs-init generates them
      # into /run/cybermole-s3/credentials.env and docker-entrypoint.sh loads
      # them (CYBERMOLE_S3_ACCESS_KEY / CYBERMOLE_S3_SECRET_KEY).
      CYBERMOLE_S3_ENDPOINT: http://seaweedfs:8333
      # task/winston-loki: winston-loki push URL — set on the host (or .env)
      # when you bring the observability profile up: 
      #   CYBERMOLE_LOKI_URL=http://loki:3100 docker compose --profile observability up -d
      # (up -d then recreates cybermole to pick it up). Unset/empty = console-only
      # logging; the dev profile and plain hosts stay that way.
      CYBERMOLE_LOKI_URL: ${CYBERMOLE_LOKI_URL:-}
      # task/logs-page: the BROWSER-reachable Grafana URL the /logs page's
      # iframe loads — DELIBERATELY default-off: grafana exists only under
      # the opt-in observability profile, and an on-by-default link would
      # iframe a dead port for every plain-stack user. To get the header's
      # logs link, bring the profile up AND set this (the .env-next-to-
      # compose.yaml pattern this file documents):
      #   echo 'CYBERMOLE_GRAFANA_URL=http://127.0.0.1:3300' >> .env
      #   CYBERMOLE_LOKI_URL=http://loki:3100 docker compose --profile observability up -d
      # NB it must be reachable from the OPERATOR'S BROWSER, not the
      # compose network — grafana publishes 127.0.0.1:3300 on the host
      # (the internal http://grafana:3000 is not routable from outside).
      # Unset/empty: no logs link, /logs answers 404.
      CYBERMOLE_GRAFANA_URL: ${CYBERMOLE_GRAFANA_URL:-}
      # task/ws-editor (docs/guides/editor-webapp.md): the editor webapp's
      # upstream on the compose network — THE single switch. The stack
      # ships the editor container (header note), so the default wires the
      # proxy on; set it EMPTY in .env to switch the editor off (the
      # console hides its affordances, /editor answers 404). No token or
      # launch URL: auth is the web session, folders are URL params.
      CYBERMOLE_EDITOR_UPSTREAM: ${CYBERMOLE_EDITOR_UPSTREAM-http://editor:3000}
      # task/app-host: the app host's socket, in
      # the shared setgid dir. The web container is CLIENT-ONLY on it for
      # now — branch 2 (task/app-web) adds the /apps/* proxy behind the
      # session gate that forwards here. The web side NEVER spawns the
      # host: the split's rule (the workspace entrypoint owns it). Set
      # EMPTY to switch the apps surface off everywhere.
      CYBERMOLE_APPS_SOCK: /run/cybermole/apps.sock
    networks: [default, storage]
    volumes:
      - cybermole-state:/state
      - cybermole-s3-credentials:/run/cybermole-s3:ro
      # Read access to pi's session store (sidebar/resume); web never
      # writes here — hidden flags live in its own db on /state. :ro makes
      # that a container-level fact, not just a convention (the session
      # cwd /workspace only needs to exist, which :ro preserves).
      - cybermole-workspace:/workspace:ro
      - cybermole-tmux:/run/cybermole
      # task/ws-jobs (plan §9): job run logs, rw — web reads the tails
      # (GET /api/jobs/:name/runs/:fired_at/log) and unlinks pruned files.
      # A separate volume at the plan-pinned path, not the workspace volume
      # rw: /workspace above stays READ-ONLY (the container-level boundary
      # the comment there describes), while both containers see the logs at
      # the same path (path agreement, like the tmux socket split).
      - cybermole-job-logs:/workspace/.cybermole/job-logs
    restart: unless-stopped

  # The working half of the split: same image, uid 2000, owns the tmux
  # server (exit-empty off) and every pi session. Admits the web user
  # (node) as a tmux client via server-access on the shared socket.
  workspace:
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    build: *cybermole-build # same build as cybermole (BuildKit dedupes); declared so a cold machine never tries to PULL cybermole:local (cf. dev-init)
    image: ${CYBERMOLE_IMAGE:-cybermole:local}
    user: "workspace"
    init: true
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/docker-workspace-entrypoint.sh"]
    healthcheck:
      disable: true # the image's healthcheck probes the web server; this container only runs tmux
    environment:
      CYBERMOLE_TMUX_SOCKET: /run/cybermole/tmux
      CYBERMOLE_AGENT_DIR: /workspace/pi-agent
      # task/app-host (apps-plan §3): this container RUNS the app host
      # (its entrypoint's second supervised child, after the tmux
      # server) on the shared socket — the working half of the split.
      # Discovery goes through the internal API on the same shared dir
      # (explicit here: path agreement across containers, like
      # CYBERMOLE_TMUX_SOCKET; the web container serves that socket).
      CYBERMOLE_APPS_SOCK: /run/cybermole/apps.sock
      CYBERMOLE_SOCK: /run/cybermole/cybermole.sock
      # jobs-agent-plan §9: the workspace root's AGENTS.md target — the
      # same path the web side's CYBERMOLE_NEW_SESSION_CWD names (path
      # agreement, like the socket and the agent dir): the entrypoint
      # seeds <this>/AGENTS.md from the image's runtime/workspace-root/ template.
      CYBERMOLE_NEW_SESSION_CWD: /workspace
      CYBERMOLE_TMUX_WEB_USER: node # admitted as a tmux client by NAME
      CYBERMOLE_TMUX_GROUP: cybermole # socket group after chgrp (gid 2001 in-image)
    volumes:
      - cybermole-tmux:/run/cybermole # the shared socket (0660 cybermole after the entrypoint's chmod/chgrp)
      - cybermole-workspace:/workspace # checkouts + pi-agent (umask 0007 keeps files group-shared)
      # task/ws-jobs (plan §9): the run-log dir at the same path web sees
      # it — the wrapper (uid 2000, umask 0007) writes the logs here.
      - cybermole-job-logs:/workspace/.cybermole/job-logs
    restart: unless-stopped

  # One-shot: empty named volumes are created root-owned; the split needs
  # the socket dir 2770 setgid cybermole (socket creation + group inheritance)
  # and /workspace owned by uid 2000. Runs on every `up` — a no-op chown
  # once ownership is right. (Entrypoint overridden: the web entrypoint
  # must not run here.) It also lays out /workspace/.cybermole — the
  # job-run log dir (plan §9) PLUS the staged shell config and zsh history
  # (task/install-docs): job-logs is its own volume (see the cybermole
  # service — web mounts /workspace READ-ONLY, but must read AND prune run
  # logs), while .cybermole itself must be workspace-writable for the shell
  # files. All owned workspace:cybermole 2770 so the workspace uid's
  # wrapper (umask 0007 under it) writes group-shared logs the web uid can
  # read + unlink.
  workspace-init:
    build: *cybermole-build
    image: ${CYBERMOLE_IMAGE:-cybermole:local}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown workspace:cybermole /run/cybermole /workspace && chmod 2770 /run/cybermole /workspace && mkdir -p /workspace/.cybermole && chown workspace:cybermole /workspace/.cybermole && chmod 2770 /workspace/.cybermole && mkdir -p /workspace/.cybermole/job-logs && chown workspace:cybermole /workspace/.cybermole/job-logs && chmod 2770 /workspace/.cybermole/job-logs"]
    restart: "no"
    volumes:
      - cybermole-tmux:/run/cybermole
      - cybermole-workspace:/workspace
      - cybermole-job-logs:/workspace/.cybermole/job-logs

  # Object storage for the web side: only cybermole shares its network (no
  # published port). Its gRPC/filer/master ports are unauthenticated —
  # the network is the boundary, and `internal` also leaves it no route
  # out. Takes the generated keys as its admin identity
  # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are mini's env names for
  # it); anonymous S3 requests get 403.
  seaweedfs:
    <<: *seaweedfs
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    entrypoint:
      - sh
      - -c
      - >-
        set -a && . /run/cybermole-s3/credentials.env && set +a &&
        export AWS_ACCESS_KEY_ID="$$CYBERMOLE_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$CYBERMOLE_S3_SECRET_KEY" &&
        exec /entrypoint.sh "$$@"
      - sh
    networks: [storage]
    volumes:
      - cybermole-seaweedfs:/data
      - cybermole-s3-credentials:/run/cybermole-s3:ro
    restart: unless-stopped

  # One-shot: generates the S3 credentials on first `up` (kept thereafter —
  # the store's data is only readable with them). One file, two readers:
  # docker-entrypoint.sh (cybermole, uid node — hence the owner) and the
  # seaweedfs wrapper above (root before it drops to its own user).
  seaweedfs-init:
    build: *cybermole-build
    image: ${CYBERMOLE_IMAGE:-cybermole:local}
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - >-
        f=/run/cybermole-s3/credentials.env;
        if [ ! -s "$$f" ]; then
        umask 077 &&
        printf 'CYBERMOLE_S3_ACCESS_KEY=cybermole\nCYBERMOLE_S3_SECRET_KEY=%s\n'
        "$$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")" > "$$f.tmp" &&
        mv "$$f.tmp" "$$f";
        fi &&
        chown node:node "$$f" && chmod 0400 "$$f"
    restart: "no"
    volumes:
      - cybermole-s3-credentials:/run/cybermole-s3

  # task/winston-loki: log aggregation, opt-in via the `observability`
  # profile. Single-binary Loki, filesystem storage on the cybermole-loki
  # volume (deploy/loki/config.yaml: retention 14d, hard caps on
  # entry/label sizes, no telemetry). No published port — cybermole pushes
  # over the compose network; a down/restarted loki degrades silently on
  # the server side (batch drops + 60s retry backoff, src/lib/platform/logger.ts).
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.8
    depends_on:
      loki-init:
        condition: service_completed_successfully
    command: ["-config.file=/etc/loki/config.yaml"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/loki/config.yaml:/etc/loki/config.yaml:ro
      - cybermole-loki:/loki
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }
    restart: unless-stopped

  # One-shot (same pattern as workspace-init/dev-init): empty named
  # volumes start root-owned and the loki image runs as uid 10001 — it
  # needs /loki writable before it boots. Runs on every `up` of the
  # profile; a no-op chown once ownership is right.
  loki-init:
    profiles: ["observability"]
    build: *cybermole-build # same build as cybermole (BuildKit dedupes; never PULLs cybermole:local)
    image: ${CYBERMOLE_IMAGE:-cybermole:local}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /loki"]
    restart: "no"
    volumes:
      - cybermole-loki:/loki

  # task/winston-loki: log UI, opt-in via the `observability` profile.
  # Loopback-published on :3300 (3000/3001 are cybermole's). Auth:
  # anonymous read-only browsing (it's loopback-only; no default-password
  # exposure), the admin account for edits — first login forces the
  # default-password change. No data volume: grafana state is disposable;
  # the datasource (and any dashboards worth keeping) is provisioned from
  # deploy/grafana/provisioning, checked in.
  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.3
    depends_on:
      - loki
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      # task/logs-page: cybermole's /logs page frames this Grafana —
      # without allow_embedding grafana answers X-Frame-Options: deny
      # (verified against the pinned 13.2.3: pkg/middleware/middleware.go
      # sets it unless cfg.AllowEmbedding) and the iframe stays blank.
      # Acceptable here exactly because the port is loopback-only with
      # anonymous read-only access.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits: { memory: 512m, cpus: "0.5" }
    restart: unless-stopped
  # task/ws-editor: the VSCodium reh-web editor — part of the plain
  # stack (docs/guides/editor-webapp.md; the header's opt-out note). The image
  # (editor/) vendors the PINNED reh-web tarball and runs its server
  # component as the workspace uid (2000) so it edits the shared
  # checkouts; it never touches the tmux socket or web state, and it
  # publishes NOTHING — cybermole's same-origin /editor proxy is the only
  # door (cybermole's CYBERMOLE_EDITOR_UPSTREAM default points here).
  editor:
    depends_on:
      editor-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
    build:
      context: ./deploy/editor
      args: # same pins as deploy/editor/Dockerfile's defaults; here so they drift visibly
        VSCODIUM_VERSION: ${VSCODIUM_VERSION:-1.140.06880}
    image: cybermole-editor:local
    user: "workspace"
    init: true # signal reaping: the server spawns ptyHost/fileWatcher children
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/docker-editor-entrypoint.sh"]
    environment:
      # Interpolates into --server-base-path: the proxy mounts the app at
      # ${CYBERMOLE_BASE%/}/editor, and the editor's asset URLs must line up.
      CYBERMOLE_BASE: ${CYBERMOLE_BASE:-/}
    volumes:
      - cybermole-workspace:/workspace # the checkouts — rw, as the workspace uid
      - cybermole-editor-home:/home/workspace # VSCodium user-data/extensions (persistent)
    restart: unless-stopped

  # task/ws-editor: one-shot — empty named volumes start root-owned and
  # uid 2000 must write $HOME (.vscodium-server data/extensions, .local
  # state). Runs on every `up`; a no-op chown once right.
  editor-init:
    build:
      context: ./deploy/editor
      # Same pins as the editor service above: both build the same tag, so
      # an operator override must reach both builds — a default-pins
      # editor-init image would otherwise sit under the overridden tag (or
      # silently revert it on the next editor-init-only build).
      args:
        VSCODIUM_VERSION: ${VSCODIUM_VERSION:-1.140.06880}
    image: cybermole-editor:local
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R workspace:cybermole /home/workspace"]
    restart: "no"
    volumes:
      - cybermole-editor-home:/home/workspace

  # One-shot: empty named volumes are created root-owned; the dev service
  # runs as ${UID:-1000} and must write node_modules and /state (its
  # CYBERMOLE_STATE_DIR — the credential seed in dev's command then runs as
  # that same uid, right after this chown). Runs on every `up` — a
  # no-op chown once ownership is right. (Entrypoint overridden: without the
  # repo bind there's no /app/package.json, and the seed logic must not run.)
  dev-init:
    profiles: ["dev"]
    # Own build (identical to dev's — BuildKit dedupes) so this service
    # never tries to *pull* cybermole:local-dev on a cold machine or under
    # partial invocations (compose --profile dev run dev-init).
    build:
      context: .
      target: dev
      args:
        CYBERMOLE_BASE: ${CYBERMOLE_BASE:-/}
    image: cybermole:local-dev
    user: "0:0"
    entrypoint:
      ["sh", "-c", "chown -R ${UID:-1000}:${GID:-1000} /app/node_modules /state"]
    restart: "no"
    volumes:
      # :z as on dev — a shared label, so a reused container can still read
      # volumes another container's create relabeled.
      - cybermole-dev-node-modules:/app/node_modules:z
      - cybermole-dev-state:/state:z

  # Dev object storage: fixed keys (the dev service and the host flow use
  # the same pair), loopback-published so `npm run dev:server` on the host
  # can reach it too — `docker compose --profile dev up -d dev-seaweedfs`,
  # then the CYBERMOLE_S3_* values below with http://127.0.0.1:8333 (README
  # "Developing"). Its own volume (prod's seaweedfs has one too): dev state
  # — the db and the content that references uploads — survives recreates
  # now, so the objects must too.
  dev-seaweedfs:
    <<: *seaweedfs
    profiles: ["dev"]
    environment:
      AWS_ACCESS_KEY_ID: cybermole-dev
      AWS_SECRET_ACCESS_KEY: cybermole-dev-secret
    ports:
      - "127.0.0.1:8333:8333" # S3 API only
    volumes:
      - cybermole-dev-seaweedfs:/data

  # The editor for dev — the same image as prod's `editor`, but as the
  # HOST uid over the SAME repo bind as `dev`: the editor tab opens the
  # workspace cwd verbatim as its ?folder= (CYBERMOLE_NEW_SESSION_CWD=/app),
  # and dev workspaces live in the bind, so the editor must see /app at
  # /app AND write it as its owner (prod's uid-2000 editor edits the
  # cybermole-workspace volume instead — path + uid agreement is per shape).
  # Like prod's: no published port — the dev container reaches it as
  # http://dev-editor:3000 over the compose network (the env above).
  dev-editor:
    profiles: ["dev"]
    depends_on:
      dev-editor-init:
        condition: service_completed_successfully
    build:
      context: ./deploy/editor
      args: # same pins as editor/editor-init: one tag, one pin
        VSCODIUM_VERSION: ${VSCODIUM_VERSION:-1.140.06880}
    image: cybermole-editor:local
    user: "${UID:-1000}:${GID:-1000}"
    init: true # signal reaping: the server spawns ptyHost/fileWatcher children
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/usr/local/bin/docker-editor-entrypoint.sh"]
    environment:
      CYBERMOLE_BASE: ${CYBERMOLE_BASE:-/} # interpolates into --server-base-path
    volumes:
      - .:/app:z # the repo — the same bind, the same path, the same owner
      - cybermole-dev-editor-home:/home/workspace # VSCodium user-data/extensions
    # no restart policy: dev is an interactive foreground thing

  # One-shot, the dev-editor counterpart of editor-init/dev-init: empty
  # named volumes start root-owned and the dev editor runs as ${UID:-1000},
  # which must write $HOME. A no-op chown once ownership is right.
  dev-editor-init:
    profiles: ["dev"]
    build:
      context: ./deploy/editor
      args: # same pins again — one tag, one pin (editor-init's note)
        VSCODIUM_VERSION: ${VSCODIUM_VERSION:-1.140.06880}
    image: cybermole-editor:local
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R ${UID:-1000}:${GID:-1000} /home/workspace"]
    restart: "no"
    volumes:
      - cybermole-dev-editor-home:/home/workspace

  dev:
    profiles: ["dev"]
    depends_on:
      dev-init:
        condition: service_completed_successfully
      dev-seaweedfs:
        condition: service_started
      # started, not healthy: dev-editor boots the workbench lazily on the
      # tab's first open anyway; dev must not wait on its image build.
      dev-editor:
        condition: service_started
    build:
      context: .
      target: dev # runtime + build-essential/python3: the container npm-installs node-pty
      args:
        CYBERMOLE_BASE: ${CYBERMOLE_BASE:-/}
    image: cybermole:local-dev
    # Match the container user to the host checkout's owner so bind-mounted
    # files (and .astro/, dist-server/ writes) aren't permission-fought.
    user: "${UID:-1000}:${GID:-1000}"
    # Same two guards as cybermole: prompt stop/restart, no in-container
    # privilege elevation.
    init: true
    security_opt: ["no-new-privileges:true"]
    # Neutralise the image's entrypoint: /app is a bind mount of the host
    # checkout, and the entrypoint serves the image copy — dev wants the
    # bind. WORKDIR /app already covers the cd.
    entrypoint: []
    # The repo is bind-mounted; node_modules is a *shadow* volume so the
    # container builds its own native deps (node-pty) without touching the
    # host's. npm install runs every boot — seconds when current, and it
    # self-heals (e.g. after a NODE_ENV change) unlike a marker-file check.
    # Then the dev credential seed — test/test, but ONLY when no credential
    # row exists yet (set-password --if-unset): the first boot of a fresh
    # state volume gets a known login, and a password later set with
    # dev:set-password is never re-seeded over, across any number of
    # recreates. Folded into this command rather than a one-shot seed
    # service: same uid as the state volume's owner (dev-init just chowned
    # it), no second npm install, and idempotent on every boot. The seeder
    # runs from dist-server, so the server half is tsc'd first — a cold
    # checkout has none (dev:server's build runs only after the exec), and
    # the extra pass is the same compile dev:server runs each boot anyway.
    # Then ONE server: dev:server (build + serve :3001 + rebuild/restart on
    # change) renders everything production does — no astro dev half.
    command:
      - sh
      - -c
      - >-
        npm install --no-audit --no-fund
        && ./node_modules/.bin/tsc -p tsconfig.server.json
        && printf 'test\ntest\ntest\n' | node dist-server/server/set-password.js --if-unset
        ; exec npm run dev:server
    ports:
      - "127.0.0.1:3001:3001" # the whole app: API+WS+SSR (npm run dev:server)
    environment:
      NODE_ENV: development # the image says production — npm would omit devDeps (tsc, @types/*)
      ASTRO_TELEMETRY_DISABLED: "1"
      CYBERMOLE_BASE: ${CYBERMOLE_BASE:-/} # same value the pages were built with
      CYBERMOLE_NEW_SESSION_CWD: /app
      # HOME is unwritable for non-1000 uids (see npm_config_cache below) and
      # /app is the host bind — so the $CYBERMOLE_HOME/.local/state default
      # won't do here. /state mirrors prod's CYBERMOLE_STATE_DIR shape, on
      # the cybermole-dev-state volume: the login db, the dev pi-agent and
      # job run logs survive recreates (dev-init chowns the fresh volume to
      # this uid; the seed above never overwrites a changed password).
      CYBERMOLE_STATE_DIR: /state
      # Dev has no /workspace, so CYBERMOLE_JOB_LOG_DIR's default would
      # leave job runs with no logs at all (their results stay 'unknown');
      # keep them with the rest of dev state instead — the run wrapper
      # creates the dir itself.
      CYBERMOLE_JOB_LOG_DIR: /state/job-logs
      # task/defaults-settings: zsh -l like the prod service (the dev image
      # installs zsh — same runtime base).
      CYBERMOLE_COMMAND: "${CYBERMOLE_COMMAND:-zsh -l}"
      # A non-1000 uid has no passwd entry → HOME=/ → npm's cache is unwritable there
      npm_config_cache: /tmp/.npm
      CYBERMOLE_S3_ENDPOINT: http://dev-seaweedfs:8333
      CYBERMOLE_S3_ACCESS_KEY: cybermole-dev
      CYBERMOLE_S3_SECRET_KEY: cybermole-dev-secret
      # task/ws-editor: the dev-editor sibling below — the editor tab is
      # ON in dev by default (the dev profile's whole point is running the
      # whole app). Set CYBERMOLE_EDITOR_UPSTREAM empty in .env to boot dev
      # without it (the `-` interpolation form keeps an explicit empty).
      CYBERMOLE_EDITOR_UPSTREAM: ${CYBERMOLE_EDITOR_UPSTREAM-http://dev-editor:3000}
    healthcheck:
      disable: true # the prod image probes :3000; dev serves :3001
    volumes:
      # :z relabels the tree container_file_t on SELinux-enforcing hosts
      # (no-op elsewhere) — without it container processes can't even stat
      # files in a home-dir checkout.
      - .:/app:z
      - cybermole-dev-node-modules:/app/node_modules:z # shadow: container-built native deps
      # Durable dev state (see CYBERMOLE_STATE_DIR above) — prod's /state
      # shape on dev's own volume, chowned by dev-init on every up.
      - cybermole-dev-state:/state:z
    # no restart policy: dev is an interactive foreground thing

volumes:
  # Explicit names (no project prefix) so the volumes stay stable across
  # checkouts with different directory names.
  cybermole-state:
    name: cybermole-state
  # Split volumes: the shared tmux socket dir, and the workspace uid's
  # tree (checkouts + pi-agent). The pre-split cybermole-app volume is
  # obsolete (web serves from the image now) and is left in place,
  # unused, on existing hosts.
  cybermole-tmux:
    name: cybermole-tmux
  cybermole-workspace:
    name: cybermole-workspace
  # task/ws-jobs (plan §9): job run logs. Mounted at /workspace/.cybermole/
  # job-logs in BOTH cybermole (rw — read + prune) and workspace (rw — the
  # run wrapper writes them), laid out by workspace-init; keeping it off
  # the workspace volume preserves cybermole's read-only /workspace mount.
  cybermole-job-logs:
    name: cybermole-job-logs
  cybermole-dev-node-modules:
    name: cybermole-dev-node-modules
  # Dev's durable state at /state — the login db, the dev pi-agent, job run
  # logs. Dev's counterpart of prod's cybermole-state, kept apart from it
  # so a dev checkout never shadows a deployed db (dev-init chowns it on
  # up, like the node_modules shadow above).
  cybermole-dev-state:
    name: cybermole-dev-state
  # Dev uploads — the dev object store's /data, persisted like prod's
  # cybermole-seaweedfs (fixed dev keys, so nothing to generate).
  cybermole-dev-seaweedfs:
    name: cybermole-dev-seaweedfs
  # task/ws-editor: the DEV editor's home (the host uid) — kept apart from
  # prod's uid-2000 cybermole-editor-home (dev-editor-init chowns it on up).
  cybermole-dev-editor-home:
    name: cybermole-dev-editor-home
  # Object storage data, and the generated credentials that unlock it —
  # back them up together.
  cybermole-seaweedfs:
    name: cybermole-seaweedfs
  cybermole-s3-credentials:
    name: cybermole-s3-credentials
  # task/winston-loki: Loki's filesystem storage (chunks, index, WAL,
  # compactor working dir) — owned by the loki image's uid 10001
  # (loki-init chowns it on first up).
  cybermole-loki:
    name: cybermole-loki
  # task/ws-editor: the editor's home (uid 2000) — VSCodium user-data,
  # extensions, server state (editor-init chowns it on first up).
  cybermole-editor-home:
    name: cybermole-editor-home

networks:
  # cybermole ↔ seaweedfs only. internal: no route out (and none in from
  # outside the two containers' own stack).
  storage:
    name: cybermole-storage
    internal: true
