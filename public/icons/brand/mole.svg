<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor">
  <!-- The mole glyph, monochrome: ink in currentColor with the light
       shapes cut as mask holes, so it takes the text colour like any icon. -->
