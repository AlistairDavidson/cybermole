# zed.example.com — TLS reverse proxy for the Zed webapp's KasmVNC client
# (task/zed-webapp, docs/zed-webapp.md). Same shape as nginx-webpi.conf:
# TLS terminates here; the container's listener is plain http because
# kasmvnc.yaml sets require_ssl: false, and the port is published
# loopback-only in compose.yaml. Auth is KasmVNC's own basic auth
# (ZED_VNC_PASSWORD → kasm_user) — a second credential on purpose: the
# stream is a GUI as the workspace user and must not open for anyone who
# can reach the proxy.
#
# The browser opens this origin directly (ConsoleState.zed.url); web-pi
# does not proxy the stream itself (docs/zed-webapp.md "Auth and
# networking" — why).
#
# Websocket upgrade needs the Upgrade/Connection headers (map + the
# proxy_setheader pair). long read timeouts: an idle VNC websocket must
# not be dropped at 60s (KasmVNC keeps it open with its own pings).

map $http_upgrade $zed_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name zed.example.com;

    ssl_certificate     /etc/letsencrypt/live/zed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zed.example.com/privkey.pem;

    # KasmVNC sets its own CSP/COEP/COOP headers; pass responses through
    # unmodified.
    location / {
        proxy_pass http://127.0.0.1:6901;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zed_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # The stream is one long-lived connection of small damage frames:
        # no response buffering — each frame reaches the client as it
        # leaves the server, or the desktop stutters behind nginx's buffer.
        proxy_buffering off;
    }
}
