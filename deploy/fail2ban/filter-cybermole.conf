# Failed cybermole logins in the nginx access log (combined format).
# Install:  cp filter-cybermole.conf /etc/fail2ban/filter.d/cybermole-auth.conf
#           append the [cybermole-auth] jail from jail.conf to
#           /etc/fail2ban/jail.local, then: systemctl restart fail2ban
# The base path must agree across exactly three files (README § "The base
# path" is the canonical list): the CYBERMOLE_BASE build arg/env in
# compose.yaml, the named capture in deploy/nginx/cybermole.conf (that file's
# single definition point), and the POST path in the failregex below —
# the one literal this file carries. Adjust only that literal when the
# base path changes.
#
# The watched path is the login POST (401|429).
# The datepattern line is required — {DATE} meta-pattern anchored to the
# [bracketed] date; without it fail2ban finds no date template and matches
# nothing.
[Definition]
datepattern = ^[^\[]*\[({DATE})
failregex = ^<HOST> .* "POST /cybermole/login HTTP/[0-9.]+" (401|429)
ignoreregex =
