# Failed web-pi logins in the nginx access log (combined format).
# Install:  cp fail2ban-filter-webpi.conf /etc/fail2ban/filter.d/webpi-auth.conf
#           append the [webpi-auth] jail from fail2ban-jail.conf to
#           /etc/fail2ban/jail.local, then: systemctl restart fail2ban
# The base path must agree across exactly three files (README § "The base
# path" is the canonical list): the WEB_PI_BASE build arg/env in
# compose.yaml, the named capture in deploy/nginx-webpi.conf (that file's
# single definition point), and the POST paths in the failregex below —
# the two literals this file carries. Adjust only those literals when the
# base path changes.
#
# Two watched paths: the login POST (401|429), and the /management
# dangerous verbs' password re-confirmation (401|429 — reauth_limited):
# the re-auth is a second password gate a live session cookie could
# # otherwise hammer without meeting the login limiter (the in-process
# reauth limiter bounds it to 10/15 min; this filter gets the perimeter
# ban too).
# The datepattern line is required — {DATE} meta-pattern anchored to the
# [bracketed] date; without it fail2ban finds no date template and matches
# nothing.
[Definition]
datepattern = ^[^\[]*\[({DATE})
failregex = ^<HOST> .* "POST /webpi/login HTTP/[0-9.]+" (401|429)
            ^<HOST> .* "POST /webpi/api/management/(build|activate) HTTP/[0-9.]+" (401|429)
ignoreregex =
