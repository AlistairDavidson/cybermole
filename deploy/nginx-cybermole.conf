# cybermole behind nginx with TLS + WebSocket upgrade.
#
# 1. Add the upgrade map at the TOP of the site file (http context,
#    outside server{}), if not already present:
#
#      map $http_upgrade $connection_upgrade {
#          default upgrade;
#          ''      close;
#      }
#
# 2. Add this location INSIDE the 443 server{} block. The base path is
#    defined exactly ONCE in this file — the named capture at the head of
#    the regex below — and must equal CYBERMOLE_BASE. Two
#    other files carry the same value: the compose build arg/env, and the
#    POST path in deploy/fail2ban-filter-cybermole.conf; README § "The base
#    path" is the canonical list. A regex location (not a plain prefix
#    location) so the value lives at a single definition point;
#    proxy_pass deliberately carries no URI part, so the client's original
#    path — base included — reaches the app unchanged (same as a plain
#    prefix location). Nginx takes the first matching regex, so keep this
#    block ahead of any broad asset-regex locations in the same server{}.
#    Adjust the port to CYBERMOLE_PORT. No auth_basic here — cybermole has its
#    own login page. No new ports: everything rides 443.

    location ~ ^(?<cybermole_base>/cybermole)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Appends the real client IP to whatever the client sent. Run
        # cybermole with CYBERMOLE_TRUST_PROXY=1 so it rate-limits on that last
        # entry (one hop) — everything left of it is client-controlled.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # cybermole pings every open terminal socket every 30s, so idle
        # terminals stay up with any timeout above that.
        proxy_read_timeout 3600s;
        proxy_redirect off;

        # File uploads (POST /api/files) take up to 5 GiB + a 1 MiB
        # multipart envelope — UPLOAD_MAX_BODY_BYTES in
        # src/schemas/uploads.ts; keep this at least that. The app holds
        # every other route to 10 KiB itself, refusing on Content-Length
        # before it reads a byte — which is why bodies must stream through
        # instead of nginx spooling each one to disk first: buffered, a
        # 5 GiB body to any route would land in nginx's temp dir before the
        # app could say no.
        client_max_body_size 5121m;
        proxy_request_buffering off;
    }
