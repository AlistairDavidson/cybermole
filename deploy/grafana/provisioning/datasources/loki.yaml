# Grafana datasource provisioning (compose `observability` profile): the
# Loki that ships in the same profile, reached over the compose network.
# Checked in — grafana itself carries no state volume, so provisioning is
# the only durable configuration.
apiVersion: 1

datasources:
  - name: Loki
    uid: cybermole-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      timeout: 60
      maxLines: 1000
